[project]
name = "euler-maruyama"
version = "0.1.0"
description = "ReCoDe - Python class for the Euler-Maruyama method for solving stochastic differential equations."
authors = [
    { name = "Antonio Malpica", email = "a.malpica-morales21@imperial.ac.uk" },
    { name = "Chris Cooling", email = "c.cooling10@imperial.ac.uk" },
]
requires-python = ">=3.9,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24.3,<2",
    "matplotlib>=3.7.1,<4",
    "jupyter>=1.0.0,<2",
    "joblib>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "black==22.10.*",
    "isort==5.12.*",
    "pytest>=7.4.0,<8",
    "pytest-html>=3.2.0,<4",
]

[tool.hatch.build.targets.sdist]
include = ["src/euler_maruyama"]

[tool.hatch.build.targets.wheel]
include = ["src/euler_maruyama"]

[tool.hatch.build.targets.wheel.sources]
"src/euler_maruyama" = "euler_maruyama"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
